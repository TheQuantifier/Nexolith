name: Bug report
description: Report a reproducible problem in implemented code, tooling, benchmarks, or documentation.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Nexolith is currently concept-stage. Please report only behavior that exists in the repository; use a discussion for planned features.
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This report concerns implemented repository content, not a planned feature.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How can we reproduce it?
      description: Include the smallest complete sequence, inputs, and commands.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include commit, OS, hardware, runtime/tool versions, build mode, and dataset where relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Logs, profiles, benchmark output, screenshots, or related links. Remove secrets and proprietary game files.

